name: NX2Apple

options:
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  NX2Apple-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dily07.nx2apple
        PRODUCT_NAME: NX2Apple
        INFOPLIST_KEY_CFBundleDisplayName: NX2Apple
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
